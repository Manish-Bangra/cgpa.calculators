    <script>
        
function calculateGrade(marks){
	
	if(marks<=100 &&marks>90){
		return 10;
	}
	else if(marks<=90 && marks>80){
		return 9;
	}
	else if(marks<=80 && marks>70){
		return 8;
	}
	else if(marks<=70 && marks>60){
		return 7;
	}
	else if(marks<=60 && marks>50){
		return 6;
	}
	else if(marks<=50 && marks>40){
		return 5;
	}
	else{
		return -1;
	}
}

    function generateSubjectInputs() {

        const numSubjects = parseInt(document.getElementById('numsubject').value);

        const semester = document.getElementById('semester').value;

       const branch = document.getElementById('branch').value;

       if(!semester ||!branch || !numSubjects || numSubjects <=0){
        alert("Please fill in all the details correctly.");
        return;
       }
       const container = document.getElementById('subject-container');
       container.innerHTML = '';//clear previous inputs if any

       for(let i=0;i<numSubjects;i++){
        const subjectDiv = document.createElement('div');
        subjectDiv.className = 'subject-row';
        subjectDiv.innerHTML = `
        <div class="subject-title">Subject ${i+1}</div>
        <div class="grid-3">
            <div>
                <input type="text" class="sub-name" placeholder="Name" required>
            </div>

            </div>
            <div>
                <input type="number" class="sub-marks" placeholder="Marks" min="0" max="100" required>
            </div>
        </div>
        `;
        container.appendChild(subjectDiv);
       }
       document.getElementById('step-1').style.display = 'none';
       document.getElementById('step-2').style.display = 'block';
       document.getElementById('error-card').style.display = 'none';
       document.getElementById('result-card').style.display = 'none';
    }

    function calculateCGPA(){

        const names = document.querySelectorAll('.sub-name');
        const credits = document.querySelectorAll('.sub-credits');

        let totalCredits = 0;

const errorCard = document.getElementById('error-card');
const resultCard = document.getElementById('result-card');

for(let i=0;i<names.length; i++){

    const subName = names[i].value || `Subject ${i + 1}`;
    const subCredit = parseInt(credits[i].value);
    const subMarks = parseInt(marks[i].value);


    if(isNaN(subCredit) || isNaN(subMarks)) {
        errorCard.innerText = "Please enter valid credits and Marks for all subjects.";
        errorCard.style.display = 'block';
        return;
    }
    const points = calculateGrade(subMarks);
